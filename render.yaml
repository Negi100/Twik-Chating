# Render Blueprint: lets Render create the backend service from this repo automatically.
services:
  - type: web
    name: chat-app-backend
    runtime: docker
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false   # you'll paste this in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://your-app.vercel.app
