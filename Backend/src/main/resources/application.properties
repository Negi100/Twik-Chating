spring.application.name=chat-app-backend

# MongoDB Atlas connection string - set MONGODB_URI as an environment variable (never commit it)
spring.data.mongodb.uri=${MONGODB_URI}

# Hosting platforms (Render, Railway, etc.) inject PORT; falls back to 8080 locally
server.port=${PORT:8080}

# Frontend URL(s) allowed to call the API / open the WebSocket, comma-separated.
# In production set e.g. CORS_ALLOWED_ORIGINS=https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Respect X-Forwarded-* headers from the platform's HTTPS proxy
server.forward-headers-strategy=framework
